services:
  ollama:
    image: ollama/ollama:0.5.7
    container_name: llm-rag-examples-ollama
    hostname: llm-rag-examples-ollama
    ports:
      - 11434:11434
    volumes:
      - ./ollama/data:/root/.ollama
      - ./ollama/work:/root/work
  jupyter:
    build:
      context: .
      dockerfile: jupyter/Dockerfiles
      args:
        - APPUSER_UID=${APPUSER_UID}
        - APPUSER_GID=${APPUSER_GID}
        - APPUSER_NAME=${APPUSER_NAME}
        - PYTHON_VERSION=${PYTHON_VERSION}
    image: llm-rag-examples-jupyter:0.0.1
    container_name: llm-rag-examples-jupyter
    hostname: llm-rag-examples-jupyter
    tty: true
    stdin_open: true
    ports:
      - 8888:8888
    volumes:
      - ./.aws:/home/${APPUSER_NAME}/.aws
      - ./jupyter/requirements.txt:/home/${APPUSER_NAME}/requirements.txt
      - ./jupyter/notebooks:/home/${APPUSER_NAME}/notebooks
      - ./jupyter/.venv:/home/${APPUSER_NAME}/.venv
    user: ${APPUSER_NAME}
    environment:
      - APPUSER_NAME=${APPUSER_NAME}
      - AWS_PROFILE=${AWS_PROFILE}
      - PIP_VERSION=${PIP_VERSION}
      - BACKLOG_API_KEY=${BACKLOG_API_KEY}
      - JUPYTER_TOKEN=${JUPYTER_TOKEN}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    command:
      - /home/${APPUSER_NAME}/startup.sh
  mysql:
    image: mysql:9.2.0
    container_name: llm-rag-examples-mysql
    hostname: llm-rag-examples-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - TZ=${MYSQL_TZ}
    ports:
      - 3306:3306
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init-db:/root/init-db
  elasticsearch1:
    # image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    image: elasticsearch:8.18.0
    container_name: llm-rag-examples-elasticsearch1
    hostname: llm-rag-examples-elasticsearch1
    environment:
      - node.name=es01
      - discovery.type=single-node
      - xpack.security.enabled=false  # 開発用途でセキュリティ無効
      - bootstrap.memory_lock=true
      # - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      # - esdata:/usr/share/elasticsearch/data
      - ./elasticsearch/esdata1:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
  kibana:
    # image: docker.elastic.co/kibana/kibana:8.13.4
    image: kibana:8.18.0
    container_name: llm-rag-examples-kibana
    hostname: llm-rag-examples-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch1:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch1